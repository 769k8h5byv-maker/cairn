<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cairn</title>

<style>
:root{
  --bg:#edf1ec;
  --card:#fff;
  --ink:#17221b;
  --muted:#69746d;
  --accent:#294b38;
  --accent2:#41664e;
  --line:#d5ddd7;
  --danger:#a33b32;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--ink);
}

header{
  background:linear-gradient(145deg,#213d2d,#41664e);
  color:white;
  padding:30px 20px 26px;
}

.brand{
  max-width:720px;
  margin:auto;
}

.logo{
  font-size:42px;
  margin-bottom:4px;
}

header h1{
  margin:0;
  font-size:32px;
}

header p{
  margin:5px 0 0;
  opacity:.85;
  font-size:15px;
}

main{
  max-width:720px;
  margin:auto;
  padding:18px 16px 100px;
}

.hero{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
}

.hero h2{
  margin:0 0 6px;
}

.hero p{
  margin:0;
  color:var(--muted);
  line-height:1.4;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:18px;
}

.menu{
  border:1px solid var(--line);
  background:white;
  border-radius:16px;
  padding:17px 14px;
  text-align:left;
  font-size:16px;
  color:var(--ink);
}

.menu .icon{
  display:block;
  font-size:27px;
  margin-bottom:7px;
}

.menu strong{
  display:block;
}

.menu span{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 0 10px;
}

.section-title h2{
  margin:0;
  font-size:20px;
}

.hike-card,
.friend-card{
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  margin:10px 0;
}

.hike-title{
  font-size:20px;
  font-weight:800;
}

.hike-location{
  color:var(--muted);
  margin-top:3px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:14px;
}

.stat{
  background:var(--bg);
  border-radius:10px;
  padding:9px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:16px;
}

.stat span{
  color:var(--muted);
  font-size:11px;
}

.note{
  margin-top:11px;
  line-height:1.4;
}

.badge{
  display:inline-block;
  background:#e6eee8;
  color:var(--accent);
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  margin-top:9px;
}

.friend-name{
  font-size:19px;
  font-weight:750;
}

.friend-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.friend-actions button{
  border:1px solid var(--line);
  background:white;
  border-radius:9px;
  padding:7px 11px;
}

.friend-actions .delete{
  color:var(--danger);
}

.check-list{
  display:grid;
  gap:8px;
  margin-top:8px;
}

.check-item{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--bg);
  padding:10px;
  border-radius:10px;
}

.check-item input{
  width:20px;
  height:20px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:28px 10px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  padding:18px;
  align-items:center;
  justify-content:center;
  z-index:20;
}

.modal.open{
  display:flex;
}

.sheet{
  background:white;
  border-radius:20px;
  padding:20px;
  width:min(620px,100%);
  max-height:92vh;
  overflow:auto;
}

.sheet h2{
  margin-top:0;
}

label{
  display:block;
  font-weight:650;
  margin:12px 0 5px;
}

input,textarea,select{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  font-size:16px;
  background:white;
}

textarea{
  min-height:80px;
  resize:vertical;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.actions button{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--line);
  font-size:16px;
}

.primary{
  background:var(--accent);
  color:white;
}

.photo-preview{
  margin-top:8px;
  max-width:100%;
  max-height:180px;
  border-radius:12px;
  display:none;
}

.fab{
  position:fixed;
  right:20px;
  bottom:22px;
  width:58px;
  height:58px;
  border:0;
  border-radius:50%;
  background:var(--accent);
  color:white;
  font-size:30px;
  box-shadow:0 4px 14px #0004;
  z-index:15;
}
</style>
</head>

<body>

<header>
<div class="brand">
<div class="logo">🥾</div>
<h1>Cairn</h1>
<p>Every trail has a story.</p>
</div>
</header>

<main>

<div class="hero">
<h2>Your adventures</h2>
<p>
Keep track of the trails, people, gear and memories
that make your hikes worth remembering.
</p>
</div>

<div class="grid">

<button class="menu" onclick="openHikeModal()">
<span class="icon">🥾</span>
<strong>Log a Hike</strong>
<span>Record a new adventure</span>
</button>

<button class="menu" onclick="showFriends()">
<span class="icon">👥</span>
<strong>Friends</strong>
<span>Your hiking crew</span>
</button>

<button class="menu" onclick="showStats()">
<span class="icon">📊</span>
<strong>My Stats</strong>
<span>Your hiking history</span>
</button>

<button class="menu" onclick="showGear()">
<span class="icon">🎒</span>
<strong>Gear</strong>
<span>What works on the trail</span>
</button>

</div>

<div class="section-title">
<h2>Recent hikes</h2>
</div>

<div id="hikes"></div>

</main>

<button class="fab" onclick="openHikeModal()">+</button>


<!-- HIKE MODAL -->

<div class="modal" id="hikeModal">

<div class="sheet">

<h2>Log a Hike</h2>

<label>Trail name</label>
<input id="trail" placeholder="e.g. Cox Heath Mountain">

<label>Location</label>
<input id="location" placeholder="e.g. Cape Breton Highlands">

<label>Date</label>
<input id="date" type="date">

<label>Distance (km)</label>
<input id="distance" type="number" step="0.1">

<label>Elevation gain (m)</label>
<input id="elevation" type="number">

<label>Pack weight (lb)</label>
<input id="pack" type="number" step="0.1">

<label>Difficulty</label>
<select id="difficulty">
<option>Easy</option>
<option>Moderate</option>
<option>Challenging</option>
<option>Hard</option>
<option>Epic</option>
</select>

<label>Who came?</label>

<div id="friendChecklist" class="check-list"></div>

<label>Other people</label>
<input id="otherFriends" placeholder="Anyone not in your Friends list">

<label>Weather</label>
<input id="weather" placeholder="e.g. Sunny, 18°C">

<label>Gear notes</label>
<textarea id="gear" placeholder="What worked? What didn't?"></textarea>

<label>Trail notes</label>
<textarea id="notes" placeholder="What do you want to remember?"></textarea>

<label>Photo</label>
<input id="photo" type="file" accept="image/*" onchange="previewPhoto(event)">

<img id="photoPreview" class="photo-preview">

<div class="actions">
<button onclick="closeHikeModal()">Cancel</button>
<button class="primary" onclick="saveHike()">Save Hike</button>
</div>

</div>
</div>


<!-- FRIENDS MODAL -->

<div class="modal" id="friendsModal">

<div class="sheet">

<h2>👥 Friends</h2>

<div id="friendsList"></div>

<div class="actions">

<button onclick="closeFriends()">
Done
</button>

<button class="primary" onclick="openFriendForm()">
+ Add Friend
</button>

</div>

</div>
</div>


<!-- FRIEND FORM -->

<div class="modal" id="friendFormModal">

<div class="sheet">

<h2 id="friendFormTitle">Add Friend</h2>

<label>Name</label>

<input
id="friendName"
placeholder="e.g. Wendy"
>

<label>Optional note</label>

<textarea
id="friendNote"
placeholder="Favourite trail, hiking style, etc."
></textarea>

<div class="actions">

<button onclick="closeFriendForm()">
Cancel
</button>

<button class="primary" onclick="saveFriend()">
Save Friend
</button>

</div>

</div>
</div>


<script>

/* Existing hikes are preserved */

let hikes =
JSON.parse(
localStorage.getItem("cairnHikes") || "[]"
);


/* Friends are stored separately */

let friends =
JSON.parse(
localStorage.getItem("cairnFriends") || "[]"
);


let editingFriendIndex=null;


/* Save hikes */

function saveHikes(){

localStorage.setItem(
"cairnHikes",
JSON.stringify(hikes)
);

}


/* Save friends */

function saveFriends(){

localStorage.setItem(
"cairnFriends",
JSON.stringify(friends)
);

}


/* Render hikes */

function render(){

let box=
document.getElementById("hikes");

if(!hikes.length){

box.innerHTML=`

<div class="empty">

🥾

<p>No hikes yet.</p>

<p>Your first adventure belongs here.</p>

</div>

`;

return;

}

let sorted=
[...hikes].sort(
(a,b)=>
new Date(b.date)-new Date(a.date)
);

box.innerHTML=
sorted.slice(0,10).map(h=>`

<div class="hike-card">

<div class="hike-title">
${esc(h.trail)}
</div>

<div class="hike-location">
📍 ${esc(h.location || "Location not entered")}
</div>

<div class="badge">
${esc(h.difficulty || "Difficulty not entered")}
</div>

<div class="stats">

<div class="stat">
<strong>${h.distance || "—"}</strong>
<span>KM</span>
</div>

<div class="stat">
<strong>${h.elevation || "—"}</strong>
<span>METRES</span>
</div>

<div class="stat">
<strong>${h.pack || "—"}</strong>
<span>LB PACK</span>
</div>

</div>

${h.friends ? `
<div class="note">
👥 <b>With:</b> ${esc(h.friends)}
</div>
` : ""}

${h.weather ? `
<div class="note">
🌦️ ${esc(h.weather)}
</div>
` : ""}

${h.notes ? `
<div class="note">
📝 ${esc(h.notes)}
</div>
` : ""}

${h.gear ? `
<div class="note">
🎒 <b>Gear:</b> ${esc(h.gear)}
</div>
` : ""}

${h.photo ? `
<img
src="${h.photo}"
style="width:100%;margin-top:12px;border-radius:12px"
>
` : ""}

</div>

`).join("");

}


/* Open hike form */

function openHikeModal(){

document
.getElementById("hikeModal")
.classList.add("open");

document
.getElementById("date")
.value=
new Date().toISOString().split("T")[0];

renderFriendChecklist();

}


/* Close hike form */

function closeHikeModal(){

document
.getElementById("hikeModal")
.classList.remove("open");

}


/* Friend checklist */

function renderFriendChecklist(){

let box=
document.getElementById("friendChecklist");

if(!friends.length){

box.innerHTML=
`<div style="color:#69746d">
No friends added yet. Add them from the Friends section.
</div>`;

return;

}

box.innerHTML=
friends.map((f,i)=>`

<label class="check-item">

<input
type="checkbox"
value="${i}"
>

<span>${esc(f.name)}</span>

</label>

`).join("");

}


/* Save hike */

function saveHike(){

let trail=
document.getElementById("trail")
.value.trim();

if(!trail){

alert("Please enter a trail name.");

return;

}


let selected=[];

document
.querySelectorAll("#friendChecklist input:checked")
.forEach(box=>{

let friend=
friends[Number(box.value)];

if(friend){

selected.push(friend.name);

}

});


let other=
document
.getElementById("otherFriends")
.value.trim();


if(other){

selected.push(other);

}


let hike={

trail:trail,

location:
document
.getElementById("location")
.value.trim(),

date:
document
.getElementById("date")
.value,

distance:
document
.getElementById("distance")
.value,

elevation:
document
.getElementById("elevation")
.value,

pack:
document
.getElementById("pack")
.value,

difficulty:
document
.getElementById("difficulty")
.value,

friends:
selected.join(", "),

weather:
document
.getElementById("weather")
.value.trim(),

gear:
document
.getElementById("gear")
.value.trim(),

notes:
document
.getElementById("notes")
.value.trim(),

photo:
document
getElementByIdSafe("photoPreview")

};


let preview=
document.getElementById("photoPreview");

if(preview.src &&
preview.src.startsWith("data:")){

hike.photo=preview.src;

}else{

hike.photo="";

}


hikes.push(hike);

saveHikes();

render();

clearHikeForm();

closeHikeModal();

}


/* Helper */

function getElementByIdSafe(id){

return "";

}


/* Clear hike form */

function clearHikeForm(){

[
"trail",
"location",
"distance",
"elevation",
"pack",
"otherFriends",
"weather",
"gear",
"notes"
].forEach(id=>{

document
.getElementById(id)
.value="";

});

document
.querySelectorAll("#friendChecklist input")
.forEach(box=>{

box.checked=false;

});

document
.getElementById("photo")
.value="";

document
.getElementById("photoPreview")
.src="";

document
.getElementById("photoPreview")
.style.display="none";

}


/* Photo preview */

function previewPhoto(event){

let file=
event.target.files[0];

if(!file){

return;

}

let reader=
new FileReader();

reader.onload=function(e){

let img=
document.getElementById("photoPreview");

img.src=e.target.result;

img.style.display="block";

};

reader.readAsDataURL(file);

}


/* Friends screen */

function showFriends(){

renderFriends();

document
.getElementById("friendsModal")
.classList.add("open");

}


function closeFriends(){

document
.getElementById("friendsModal")
.classList.remove("open");

}


/* Render friends */

function renderFriends(){

let box=
document.getElementById("friendsList");

if(!friends.length){

box.innerHTML=`

<div class="empty">

👥

<p>No friends yet.</p>

<p>Add your hiking crew!</p>

</div>

`;

return;

}

box.innerHTML=
friends.map((f,i)=>`

<div class="friend-card">

<div class="friend-name">
👤 ${esc(f.name)}
</div>

${
f.note
?
`<div class="note">${esc(f.note)}</div>`
:
""
}

<div class="friend-actions">

<button
onclick="editFriend(${i})"
>
✏️ Edit
</button>

<button
class="delete"
onclick="deleteFriend(${i})"
>
🗑 Delete
</button>

</div>

</div>

`).join("");

}


/* Add friend */

function openFriendForm(){

editingFriendIndex=null;

document
.getElementById("friendFormTitle")
.textContent="Add Friend";

document
.getElementById("friendName")
.value="";

document
.getElementById("friendNote")
.value="";

document
.getElementById("friendFormModal")
.classList.add("open");

}


/* Edit friend */

function editFriend(i){

editingFriendIndex=i;

let f=friends[i];

document
.getElementById("friendFormTitle")
.textContent="Edit Friend";

document
.getElementById("friendName")
.value=f.name;

document
.getElementById("friendNote")
.value=f.note || "";

document
.getElementById("friendFormModal")
.classList.add("open");

}


/* Close friend form */

function closeFriendForm(){

document
.getElementById("friendFormModal")
.classList.remove("open");

}


/* Save friend */

function saveFriend(){

let name=
document
.getElementById("friendName")
.value.trim();

let note=
document
.getElementById("friendNote")
.value.trim();

if(!name){

alert("Please enter a friend's name.");

return;

}


if(editingFriendIndex===null){

friends.push({

name:name,
note:note

});

}else{

friends[editingFriendIndex].name=name;

friends[editingFriendIndex].note=note;

}


saveFriends();

renderFriends();

closeFriendForm();

}


/* Delete friend */

function deleteFriend(i){

let confirmed=
confirm(
"Remove "+friends[i].name+" from your Friends list?"
);

if(!confirmed){

return;

}

friends.splice(i,1);

saveFriends();

renderFriends();

}


/* Stats */

function showStats(){

let count=hikes.length;

let distance=
hikes.reduce(
(sum,h)=>
sum+(Number(h.distance)||0),
0
);

let elevation=
hikes.reduce(
(sum,h)=>
sum+(Number(h.elevation)||0),
0
);

alert(

"YOUR CAIRN STATS\n\n"+

"Hikes: "+count+"\n"+

"Distance: "+
distance.toFixed(1)+
" km\n"+

"Elevation: "+
Math.round(elevation)+
" m"

);

}


/* Gear */

function showGear(){

let notes=
hikes
.filter(h=>h.gear)
.map(h=>"• "+h.gear)
.join("\n");

alert(

notes

?

"GEAR NOTES\n\n"+notes

:

"No gear notes yet.\n\nAdd gear notes when you log a hike."

);

}


/* Escape HTML */

function esc(s){

return String(s).replace(
/[&<>"']/g,

ch=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[ch])

);

}


/* Start */

render();

</script>

</body>
</html>
