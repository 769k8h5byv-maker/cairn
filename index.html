async function signUp(){

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;


if(!email || !password){

showAuthMessage(

const {

error
} =

password:password

});


if(error){

showAuthMessage(
error.message
);

return;

}


if(data.session){

showApp();

await loadData();

}else{

showAuthMessage(

data:{
user
}

if(!user){

return;

.getElementById("userDisplay")

.from("hikes")

);

friends =

<button

}


/* =====================================================
   SHARE HIKE
   ===================================================== */

async function shareHike(index){

const hike =
hikes[index];


if(!hike){

return;

}


let shareText =
"🥾 Cairn — " +
(hike.trail || "Hike") +
"\n\n";


if(hike.location){

shareText +=
"📍 " +
hike.location +
"\n";

}


if(hike.hike_date){

shareText +=
"📅 " +
hike.hike_date +
"\n";

}


if(hike.distance){

shareText +=
"📏 " +
hike.distance +
" km\n";

}


if(hike.elevation){

shareText +=
"⛰️ " +
hike.elevation +
" m elevation\n";

}


if(hike.pack){

shareText +=
"🎒 " +
hike.pack +
" lb pack\n";

}


if(hike.difficulty){

shareText +=
"🥾 Difficulty: " +
hike.difficulty +
"\n";

}


if(hike.friends){

shareText +=
"👥 With: " +
hike.friends +
"\n";

}


if(hike.weather){

shareText +=
"🌦️ " +
hike.weather +
"\n";

}


if(hike.notes){

shareText +=
"\n📝 " +
hike.notes +
"\n";

}


if(hike.gear){

shareText +=
"\n🎒 Gear: " +
hike.gear +
"\n";

}


if(hike.latitude && hike.longitude){

const mapUrl =
"https://www.google.com/maps/search/?api=1&query=" +
encodeURIComponent(
hike.latitude + "," + hike.longitude
);

shareText +=
"\n🗺️ Trailhead:\n" +
mapUrl +
"\n";

}


shareText +=
"\n🌲 Shared from Cairn — Every trail has a story.";


try{

if(navigator.share){

await navigator.share({

title:
"Cairn — " +
(hike.trail || "My Hike"),

text:
shareText

});

}else{

await copyShareText(shareText);

}

}catch(error){

if(error.name !== "AbortError"){

await copyShareText(shareText);

}

}

}


/* =====================================================
   COPY SHARE TEXT
   ===================================================== */

async function copyShareText(text){

try{

await navigator.clipboard.writeText(text);

alert(
"🌲 Hike copied!\n\n" +
"Paste it into a message to your hiking bud."
);

}catch(error){

const temp =
document.createElement("textarea");

temp.value =
text;

document.body.appendChild(temp);

temp.select();

document.execCommand("copy");

temp.remove();

alert(
"🌲 Hike copied!\n\n" +
"Paste it into a message to your hiking bud."
);

}

}

if(!navigator.geolocation){

status.textContent =
"Getting your location...";


navigator.geolocation.getCurrentPosition(

position => {

document
.getElementById("latitude")
.value =
position.coords.latitude.toFixed(6);


document
.getElementById("longitude")
.value =
position.coords.longitude.toFixed(6);


status.textContent =
"📍 Location captured!";

},

error => {

status.textContent =
"Couldn't get your location. Check your browser's location permission.";

},

{
enableHighAccuracy:true,
timeout:10000,
maximumAge:0
}

);

}

document
.getElementById("trail")
.value
.trim();

);

}


let selectedFriends = [];

);

.getElementById("otherFriends")

.trim();

otherFriends
);

}


const photo =
document
.getElementById("photoPreview")
.src;


const {
error
} =
await db
.from("hikes")
.insert({

trail:trail,

location:
document
.getElementById("location")
.value
.trim(),

hike_date:
document
.getElementById("date")
.value ||
null,

distance:
numberOrNull("distance"),

elevation:
numberOrNull("elevation"),

pack:
numberOrNull("pack"),

difficulty:
document
.getElementById("difficulty")
.value,

friends:
selectedFriends.join(", "),

weather:
document
.getElementById("weather")
.value
.trim(),

gear:
document
.getElementById("gear")
.value
.trim(),

notes:
document
.getElementById("notes")
.value
.trim(),

latitude:
numberOrNull("latitude"),

longitude:
numberOrNull("longitude"),

photo:
photo &&
photo.startsWith("data:")

photo
:
null

});


if(error){

);

}


clearHikeForm();

closeHikeModal();

await loadData();

}


function numberOrNull(id){

const value =
document
.getElementById(id)
.value
.trim();

return null;

return Number(value);

function openFriendForm(){

null;

function editFriend(id){

const friend =
friends.find(
f => f.id === id
);


if(!friend){

return;

}


editingFriendId =
id;


document
.getElementById("friendFormTitle")
.textContent =
"Edit Friend";


document
.getElementById("friendName")
.value =
friend.name;


document
.getElementById("friendNote")
.value =
friend.note || "";


document
.getElementById("friendFormModal")
.classList.add("open");

}

document
.getElementById("friendFormModal")

}


async function saveFriend(){

const name =
document
.getElementById("friendName")
.value
.trim();


const note =
document
.getElementById("friendNote")
.value
.trim();


if(!name){

alert(
"Please enter your friend's name."
);

return;

}


let result;


if(editingFriendId){

result =
await db
.from("friends")
.update({

name:name,
note:note

})
.eq(
"id",
editingFriendId
);

}else{

result =
await db
.from("friends")
.insert({

name:name,
note:note

});

}


if(result.error){

alert(
"Couldn't save friend:\n\n" +
result.error.message
);

return;

}


closeFriendForm();

await loadData();

renderFriends();

}


async function deleteFriend(id){

const friend =
friends.find(
f => f.id === id
);


if(!friend){

return;

}


if(
!confirm(
"Remove " +
friend.name +
" from your Friends list?"
)
){

return;

}


const {
error
} =
await db
.from("friends")
.delete()
.eq(
"id",
id
);


if(error){

alert(
"Couldn't delete friend:\n\n" +
error.message
);

return;

}


await loadData();

renderFriends();

}

/* =====================================================
   SECURITY / DISPLAY
   ===================================================== */

function esc(value){

return String(value)
.replace(
/[&<>"']/g,

char => ({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[char])

);

}
